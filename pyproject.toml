[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "binance-monitor"
version = "0.1.0"
description = "Binance USD-M Futures orders & positions monitor (Telegram + Pushover)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.32.0",
    "aiosqlite==0.22.1",
    "cryptography==50.0.2",
    "httpx==0.28.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "websockets==17.4",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "respx==0.23.1",
    "ruff==0.17.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/binance_monitor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
